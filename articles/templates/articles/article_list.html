<!DOCTYPE html>
<html>
<head>
    <title>Articles</title>
</head>
<body>
    <h1>Articles</h1>
    {% if articles %}
    <ul style="list-style-type: none">
        {% for article in articles %}
        <li>
            <h2><a href={{article.permalink}} style=""text-decoration: none;">{{ article.title }}</a></h2>
            <p>by {{ article.author.username }} on {{ article.created_at|date:"M d, Y" }}</p>
            <p>{{ article.description }}</p>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No articles yet.</p>
    {% endif %}
</body>
</html>
